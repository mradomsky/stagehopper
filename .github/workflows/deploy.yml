name: Deploy Stagehopper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Lambda dependencies
        run: npm install --prefix lambda

      - name: Type check
        run: |
          npm run check
          npm run check --prefix lambda

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOYMENT_ROLE_NAME }}
          aws-region: eu-central-1

      # data/festivals.json is admin-editable at runtime (see PUT /api/stagehopper/admin/festivals)
      # and lives outside ./build — excluded so a deploy never overwrites an admin's edits.
      # Until the first admin save creates it, the app falls back to its compiled defaults
      # (src/lib/stagehopper/festivals.svelte.ts); there's nothing to seed from a deploy.
      - name: Deploy to S3
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --delete --exclude "data/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STAGEHOPPER_CF_DISTRIBUTION_ID }} \
            --paths "/*"

      # The bundle is self-contained, so only the single output file is uploaded.
      - name: Deploy Lambda
        run: |
          cd lambda/dist
          zip -r ../../lambda.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name stagehopper \
            --zip-file fileb://lambda.zip
