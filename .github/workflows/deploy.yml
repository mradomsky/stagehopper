name: Deploy Stagehopper

# The run title shows what's shipping: the release tag on a tag push (github.ref_name
# is the short tag, e.g. v1.2.0), the branch on a manual re-run — instead of the
# default commit message.
run-name: Deploy ${{ github.ref_name }}

# Prod deploys only on a release tag (e.g. v1.2.0) — pushing to main no longer
# ships. Tag a reviewed commit on main to release it. workflow_dispatch stays for
# manual re-runs of an already-tagged state.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Lambda dependencies
        run: npm install --prefix lambda

      - name: Type check
        run: |
          npm run check
          npm run check --prefix lambda

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Clerk's publishable key, baked into the client so it can start a session. Public
          # by design — it names the instance, it does not authorize anything. Stored as a
          # repo secret only because that is the mechanism this workflow already uses; the
          # matching CLERK_SECRET_KEY is never needed here, because there is no server.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # Public VAPID key, baked into the client so it can subscribe to Web Push.
          # Public by design; the matching private key lives only on the notifier Lambda.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOYMENT_ROLE_NAME }}
          aws-region: eu-central-1

      # No --delete here: the previous build's hashed assets must stay live in S3 until
      # every CloudFront edge is confirmed serving the new index.html below. Deleting them
      # in the same pass would let a client holding a stale cached index.html 404 on assets
      # it references, mid-propagation (see #42).
      #
      # data/festivals/index.json and data/festivals/{id}/timetable.json are republished by
      # the Lambda on every admin write (source of truth is DynamoDB now) and live outside
      # ./build — excluded from every sync below so a deploy never overwrites an admin's
      # edits. Until the first admin save creates one, the app falls back to its compiled
      # defaults (src/lib/stagehopper/festivals.svelte.ts); there's nothing to seed from a
      # deploy.
      # Two passes so cache headers match the file's mutability:
      #  - hashed assets (/_app/immutable/*) are content-addressed, so cache them forever.
      #  - HTML has a stable URL but changing content (it names the current asset hashes),
      #    so it must be `no-cache` — always revalidated. Without this a browser/edge keeps
      #    a stale index.html, and once the next deploy deletes the old hashes it referenced
      #    the page 404s its own scripts and renders blank.
      #  - sw.js is the same shape as HTML: a stable URL whose content changes. It must not
      #    be `immutable` — that pins a stale service worker (and its push handler) on every
      #    device and in every CloudFront edge for up to a year.
      - name: Upload hashed assets to S3 (immutable)
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --exclude "data/*" --exclude "*.html" --exclude "sw.js" --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML to S3 (no-cache)
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --exclude "*" --include "*.html" --cache-control "no-cache"

      # sw.js must be `cp`, not `sync`. `s3 sync` uploads only when size/mtime differ, so a
      # release that doesn't change the worker's bytes leaves the S3 object untouched — and
      # with it, whatever cache-control it already had. That is exactly how it got stuck as
      # `immutable`: the header was corrected in the manifest but sync never re-uploaded the
      # unchanged file, so the fix was silently a no-op. `cp` always transfers and rewrites
      # the metadata, guaranteeing `no-cache` lands on the object every deploy.
      - name: Upload the service worker to S3 (no-cache, forced)
        run: aws s3 cp ./build/sw.js s3://stagehopper-radomskyi-com/sw.js --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STAGEHOPPER_CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.STAGEHOPPER_CF_DISTRIBUTION_ID }} \
            --id "$invalidation_id"

      # Only now is every edge guaranteed to be serving the new index.html, so it's safe
      # to remove whatever hashed assets the previous build left behind.
      - name: Remove stale assets from S3
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --delete --exclude "data/*"

      # Each bundle is self-contained; zip only its own file so a function never carries
      # the other's code. build:lambda emits both index.mjs and notifier.mjs into dist.
      - name: Deploy API Lambda
        run: |
          cd lambda/dist
          zip -r ../../lambda.zip index.mjs
          cd ../..
          aws lambda update-function-code \
            --function-name stagehopper \
            --zip-file fileb://lambda.zip
          # update-function-code returns as soon as the upload is accepted, while
          # LastUpdateStatus is still InProgress — and an invoke landing in that window runs
          # the PREVIOUS code. The republish below invoked one second later and hit exactly
          # that: the old bundle had no maintenance path, answered `{"error":"Not found"}`,
          # and failed the v0.5.6 release. Nothing else here invokes the function, so this is
          # the only step that has to wait for the new code to actually be live.
          aws lambda wait function-updated-v2 --function-name stagehopper

      # The scheduled notifier (EventBridge → this function). Its function name and
      # handler (notifier.handler) are declared in the Terraform infra repo.
      - name: Deploy Notifier Lambda
        run: |
          cd lambda/dist
          zip -r ../../notifier.zip notifier.mjs
          cd ../..
          aws lambda update-function-code \
            --function-name stagehopper-notifier \
            --zip-file fileb://notifier.zip

      # Every API path must be declared as an aws_apigatewayv2_route in Terraform
      # (infrastructure repo), separately from the Lambda's own route switch. Miss the
      # Terraform route and the request falls through to the SPA index.html — a 200 with
      # content-type text/html that looks fine but never reaches the Lambda (once shipped
      # a broken map upload this way). Probe every route with an empty body: auth/validation
      # rejects it before any side effect, so a wired route answers with application/json.
      # Any text/html back means the route is missing at the gateway — fail the deploy.
      - name: Smoke-test API routes reach the Lambda
        run: |
          base="https://stagehopper.radomskyi.com/api/stagehopper"
          routes=(
            "POST    ${base}/rooms"
            "GET     ${base}/rooms/smoketest/selections"
            "PUT     ${base}/rooms/smoketest/selections"
            "DELETE  ${base}/rooms/smoketest/selections"
            "GET     ${base}/users/me/rooms"
            "POST    ${base}/users/me/notifications"
            "PUT     ${base}/users/me/notifications"
            "POST    ${base}/users/me/notifications/subscription"
            "DELETE  ${base}/users/me/notifications/subscription"
            "GET     ${base}/admin/me"
            "GET     ${base}/admin/festivals"
            "POST    ${base}/admin/festivals"
            "PATCH   ${base}/admin/festivals/smoke"
            "PATCH   ${base}/admin/festivals/smoke/stage-order"
            "DELETE  ${base}/admin/festivals/smoke"
            "POST    ${base}/admin/festivals/smoke/image-upload"
            "POST    ${base}/admin/festivals/smoke/map-upload"
            "POST    ${base}/admin/festivals/smoke/timetable-import"
            "PATCH   ${base}/admin/festivals/smoke/timetable"
            "POST    ${base}/admin/rooms"
            "POST    ${base}/admin/users"
            "DELETE  ${base}/admin/rooms/smoketest"
            "DELETE  ${base}/admin/users/smoketest"
            "POST    ${base}/admin/users/smoketest/test-notification"
          )
          # Unauthenticated → each wired route answers 401 from the JWT authorizer, except
          # the public selections read, which answers 200. Either way it is JSON, never the
          # SPA index.html CloudFront serves for an unmatched path. Note this probes the
          # gateway now rather than the Lambda: an authorizer rejects before invoking, so a
          # route wired to the wrong integration would still be caught, but a handler bug
          # would not be. That was always true of a smoke test that sends an empty body.
          # A GET must carry no body: a GET-with-body itself provokes an HTML response and
          # would false-fail. So only non-GET methods send -d '{}'.
          failed=0
          for entry in "${routes[@]}"; do
            method=$(echo "$entry" | awk '{print $1}')
            url=$(echo "$entry" | awk '{print $2}')
            if [ "$method" = "GET" ]; then
              ct=$(curl -s -o /dev/null -w '%{content_type}' -X GET "$url")
            else
              ct=$(curl -s -o /dev/null -w '%{content_type}' -X "$method" \
                -H 'Content-Type: application/json' -d '{}' "$url")
            fi
            if echo "$ct" | grep -qi 'text/html'; then
              echo "MISSING ROUTE (got SPA HTML): $method $url"
              failed=1
            else
              echo "ok ($ct): $method $url"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more API routes returned SPA HTML — a Terraform aws_apigatewayv2_route is missing."
            exit 1
          fi

      # data/festivals/index.json is *derived* from DynamoDB by the code just deployed, but
      # it is only rewritten when an admin saves a festival. Ship a Lambda that publishes a
      # new field and the live file keeps the old shape until somebody happens to make an
      # unrelated edit — that is how `description` stayed missing from the festival page for
      # a full release after the code to publish it shipped. This direct invoke (no API
      # Gateway route, no auth — the deploy role's IAM is the authorization) regenerates it
      # so the published copy can never lag the code that generates it.
      #
      # Deliberately the last step: it is the only one that can fail without leaving the
      # release half-shipped, and putting it earlier did exactly that — its failure on v0.5.6
      # skipped the notifier deploy and the route smoke test below.
      - name: Republish the public festivals manifest
        run: |
          aws lambda invoke \
            --function-name stagehopper \
            --cli-binary-format raw-in-base64-out \
            --payload '{"republish":"festivals-manifest"}' \
            republish.json
          cat republish.json
          jq -e '.ok == true' republish.json > /dev/null || {
            echo "::error::Republishing data/festivals/index.json failed — the public manifest may be missing fields this build publishes. Re-running this step alone is safe."
            exit 1
          }
