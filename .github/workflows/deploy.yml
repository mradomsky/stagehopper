name: Deploy Stagehopper

# Prod deploys only on a release tag (e.g. v1.2.0) — pushing to main no longer
# ships. Tag a reviewed commit on main to release it. workflow_dispatch stays for
# manual re-runs of an already-tagged state.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Lambda dependencies
        run: npm install --prefix lambda

      - name: Type check
        run: |
          npm run check
          npm run check --prefix lambda

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOYMENT_ROLE_NAME }}
          aws-region: eu-central-1

      # No --delete here: the previous build's hashed assets must stay live in S3 until
      # every CloudFront edge is confirmed serving the new index.html below. Deleting them
      # in the same pass would let a client holding a stale cached index.html 404 on assets
      # it references, mid-propagation (see #42).
      #
      # data/festivals.json is admin-editable at runtime (see PUT /api/stagehopper/admin/festivals)
      # and lives outside ./build — excluded from every sync below so a deploy never
      # overwrites an admin's edits. Until the first admin save creates it, the app falls
      # back to its compiled defaults (src/lib/stagehopper/festivals.svelte.ts); there's
      # nothing to seed from a deploy.
      # Two passes so cache headers match the file's mutability:
      #  - hashed assets (/_app/immutable/*) are content-addressed, so cache them forever.
      #  - HTML has a stable URL but changing content (it names the current asset hashes),
      #    so it must be `no-cache` — always revalidated. Without this a browser/edge keeps
      #    a stale index.html, and once the next deploy deletes the old hashes it referenced
      #    the page 404s its own scripts and renders blank.
      - name: Upload hashed assets to S3 (immutable)
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --exclude "data/*" --exclude "*.html" --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML to S3 (no-cache)
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --exclude "*" --include "*.html" --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STAGEHOPPER_CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.STAGEHOPPER_CF_DISTRIBUTION_ID }} \
            --id "$invalidation_id"

      # Only now is every edge guaranteed to be serving the new index.html, so it's safe
      # to remove whatever hashed assets the previous build left behind.
      - name: Remove stale assets from S3
        run: aws s3 sync ./build s3://stagehopper-radomskyi-com --delete --exclude "data/*"

      # The bundle is self-contained, so only the single output file is uploaded.
      - name: Deploy Lambda
        run: |
          cd lambda/dist
          zip -r ../../lambda.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name stagehopper \
            --zip-file fileb://lambda.zip

      # Every API path must be declared as an aws_apigatewayv2_route in Terraform
      # (infrastructure repo), separately from the Lambda's own route switch. Miss the
      # Terraform route and the request falls through to the SPA index.html — a 200 with
      # content-type text/html that looks fine but never reaches the Lambda (once shipped
      # a broken map upload this way). Probe every route with an empty body: auth/validation
      # rejects it before any side effect, so a wired route answers with application/json.
      # Any text/html back means the route is missing at the gateway — fail the deploy.
      - name: Smoke-test API routes reach the Lambda
        run: |
          base="https://stagehopper.radomskyi.com/api/stagehopper"
          routes=(
            "POST    ${base}/rooms"
            "GET     ${base}/rooms/smoketest/selections"
            "PUT     ${base}/rooms/smoketest/selections"
            "DELETE  ${base}/rooms/smoketest/selections"
            "POST    ${base}/users/me/rooms"
            "POST    ${base}/admin/me"
            "PUT     ${base}/admin/festivals"
            "POST    ${base}/admin/festivals/smoke/image-upload"
            "POST    ${base}/admin/festivals/smoke/map-upload"
            "POST    ${base}/admin/festivals/smoke/timetable-import"
            "PATCH   ${base}/admin/festivals/smoke/timetable"
            "POST    ${base}/admin/rooms"
            "POST    ${base}/admin/users"
            "DELETE  ${base}/admin/rooms/smoketest"
            "DELETE  ${base}/admin/users/smoketest"
          )
          # Empty body → each wired route answers 400 (validation/missing token) or, for
          # the GET, 200 — always JSON, never a 404/403 that CloudFront would rewrite to
          # the SPA index.html. A GET must carry no body: a GET-with-body itself provokes
          # an HTML response and would false-fail. So only non-GET methods send -d '{}'.
          failed=0
          for entry in "${routes[@]}"; do
            method=$(echo "$entry" | awk '{print $1}')
            url=$(echo "$entry" | awk '{print $2}')
            if [ "$method" = "GET" ]; then
              ct=$(curl -s -o /dev/null -w '%{content_type}' -X GET "$url")
            else
              ct=$(curl -s -o /dev/null -w '%{content_type}' -X "$method" \
                -H 'Content-Type: application/json' -d '{}' "$url")
            fi
            if echo "$ct" | grep -qi 'text/html'; then
              echo "MISSING ROUTE (got SPA HTML): $method $url"
              failed=1
            else
              echo "ok ($ct): $method $url"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more API routes returned SPA HTML — a Terraform aws_apigatewayv2_route is missing."
            exit 1
          fi
