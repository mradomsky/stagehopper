name: Checks

# Runs the team checks from docs/agents/heinzelwerk/team.md on every PR.
# heinzelwerk's merge gate merges only when these pass.
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lambda/package-lock.json
      # npm install, not npm ci: the lockfile (written on Windows) misses Linux-only optional deps; deploy.yml installs the same way.
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix lambda --no-audit --no-fund
      - run: npm run check -- --threshold error
      - run: npm run check --prefix lambda
      - run: npm test -- --reporter=dot
      - run: npm audit --audit-level=high
