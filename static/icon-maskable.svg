<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="StageHopper">
	<defs>
		<radialGradient id="bg" cx="50%" cy="32%" r="80%">
			<stop offset="0%" stop-color="#e74c3c" />
			<stop offset="100%" stop-color="#141414" />
		</radialGradient>
	</defs>
	<rect width="512" height="512" fill="url(#bg)" />
	<!-- Same mark, scaled to ~78% around center so Android's mask never clips it (safe zone). -->
