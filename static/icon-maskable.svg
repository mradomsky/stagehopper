		<polygon points="200,168 392,128 392,172 200,212" />
		<rect x="197" y="176" width="14" height="180" />
		<rect x="377" y="136" width="14" height="180" />
		<ellipse cx="164" cy="356" rx="46" ry="32" transform="rotate(-20 164 356)" />
		<ellipse cx="344" cy="316" rx="46" ry="32" transform="rotate(-20 344 316)" />
	</g>
</svg>
